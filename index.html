<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meu Álbum RA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene
      mindar-image="imageTargetSrc: targets/targets.mind; autoStart: true;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="meu-video" src="assets/video.mp4" preload="auto" webkit-playsinline playsinline></video>
      </a-assets>

      <!-- Alvo RA -->
      <a-image-target targetIndex="0">
        <!-- Ajuste a largura e altura aqui -->
        <a-video
          src="#meu-video"
          position="0 0 0"
          rotation="0 0 0"
          width="1.5"
          height="2.7"
        ></a-video>
      </a-image-target>
    </a-scene>

    <script>
      const video = document.querySelector("#meu-video");
      const scene = document.querySelector("a-scene");

      scene.addEventListener("targetFound", async () => {
        try {
          await video.play();
        } catch (err) {
          // Se o navegador bloquear o áudio, mostra um botão para ativar
          const btn = document.createElement("button");
          btn.innerText = "Ativar Som";
          btn.style.position = "absolute";
          btn.style.top = "50%";
          btn.style.left = "50%";
          btn.style.transform = "translate(-50%, -50%)";
          btn.style.fontSize = "22px";
          btn.style.padding = "12px 24px";
          btn.style.background = "#333";
          btn.style.color = "#fff";
          btn.style.border = "none";
          btn.style.borderRadius = "8px";
          btn.style.cursor = "pointer";
          document.body.appendChild(btn);

          btn.addEventListener("click", () => {
            video.play();
            btn.remove();
          });
        }
      });

      scene.addEventListener("targetLost", () => {
        video.pause();
      });
    </script>
  </body>
</html>
