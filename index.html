<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Experiência RA - Vídeo com Áudio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body { margin: 0; overflow: hidden; }
      #soundButton {
        display: none;
        position: absolute;
        top: 20px; left: 50%;
        transform: translateX(-50%);
        background: #000; color: #fff;
        padding: 10px 20px; border-radius: 10px;
        font-size: 16px; cursor: pointer;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <button id="soundButton">Ativar Som</button>

    <a-scene
      mindar-image="imageTargetSrc: targets/targets.mind; autoStart: true;"
      color-space="sRGB"
      embedded
      renderer="colorManagement: true, physicallyCorrectLights"
    >
      <a-assets>
        <video id="video" src="assets/video.mp4" preload="auto" webkit-playsinline playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video
          id="videoPlane"
          src="#video"
          width="1"
          height="1.8"
          position="0 0 0"
          rotation="0 0 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector("#video");
      const soundButton = document.querySelector("#soundButton");

      // Inicia vídeo quando o alvo for encontrado
      document.querySelector("a-scene").addEventListener("targetFound", () => {
        video.play().catch(() => {
          soundButton.style.display = "block"; // mostra botão se bloqueou o som
        });
      });

      // Botão ativa som se necessário
      soundButton.addEventListener("click", () => {
        video.play();
        soundButton.style.display = "none";
      });
    </script>
  </body>
</html>
