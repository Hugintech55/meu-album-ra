<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99;
        }
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="arjs-loader">
        <div>Carregando Realidade Aumentada...</div>
    </div>
    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        arjs="sourceType: webcam; detectionMode: mono; patternRatio: 0.9;"
        embedded
        gesture-detector
    >
        <a-marker preset="custom" type="pattern" url="./marker.patt">
            <a-video
                src="./video.mp4"
                width="1.6"
                height="0.9"
                position="0 0 0"
                rotation="-90 0 0"
                autoplay
                loop
                playsinline
                crossorigin="anonymous"
            ></a-video>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
    <script>
        // Script para remover o loader quando a AR estiver pronta (opcional)
        window.addEventListener('arjs-original-ar-init', function() {
            const loader = document.querySelector('.arjs-loader');
            if (loader) {
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
