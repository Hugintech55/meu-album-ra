<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Álbum RA</title>

    <!-- MindAR + AFRAME -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.0/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      #unmuteButton {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        font-size: 16px;
        background: #ff004c;
        color: white;
        border: none;
        border-radius: 10px;
        display: none;
        cursor: pointer;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <button id="unmuteButton">Ativar Som</button>

    <!-- Cena AR -->
    <a-scene
      mindar-image="imageTargetSrc: targets/targets.mind; autoStart: true;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
    >
      <a-assets>
        <!-- Use SEU vídeo aqui -->
        <video id="video1" src="assets/video.mp4" preload="auto" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Exibe o vídeo vertical sobre a imagem detectada -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video
          id="videoPlane"
          src="#video1"
          width="1.5"
          height="2.7"
          position="0 0 0"
          rotation="0 0 0"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const videoEl = document.querySelector("#video1");
      const unmuteButton = document.querySelector("#unmuteButton");

      // Quando detectar a imagem, reproduz o vídeo
      document.querySelector("[mindar-image-target]").addEventListener("targetFound", () => {
        videoEl.muted = false;
        videoEl.play().then(() => {
          console.log("Vídeo reproduzindo com som!");
        }).catch(() => {
          // Se o navegador bloquear o áudio, mostra o botão
          unmuteButton.style.display = "block";
        });
      });

      // Botão para liberar áudio se bloqueado
      unmuteButton.addEventListener("click", () => {
        videoEl.play();
        unmuteButton.style.display = "none";
      });
    </script>
  </body>
</html>
