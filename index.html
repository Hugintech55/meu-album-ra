<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meu primeiro WebAR com MindAR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
      #unmuteBtn {
        position: fixed; z-index: 10; left: 12px; top: 12px; padding: 10px 14px; border: 0; border-radius: 10px;
        background: rgba(0,0,0,.7); color: #fff; font-weight: 600; cursor: pointer; display: none;
      }
      #tips { position: fixed; z-index: 10; right: 12px; top: 12px; color: #fff; background: rgba(0,0,0,.35); padding: 8px 12px; border-radius: 10px; font-size: 14px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <button id="unmuteBtn">▶️ Tocar com som</button>
    <div id="tips">Aponte para a foto‑gatilho</div>

    <a-scene
      mindar-image="imageTargetSrc: targets/targets.mind; autoStart: true;"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <video id="video1" src="assets/video.mp4" preload="auto" webkit-playsinline playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target0" mindar-image-target="targetIndex: 0">
        <a-video id="videoPlane" src="#video1" position="0 0 0" rotation="0 0 0" width="1" height="0.5625"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector('#video1');
      const target0 = document.querySelector('#target0');
      const unmuteBtn = document.querySelector('#unmuteBtn');
      
      // O vídeo já começa mudo.
      video.muted = true;
      
      // Quando o marcador é encontrado, tentamos reproduzir o vídeo.
      target0.addEventListener('targetFound', () => {
        // Tentamos tocar o vídeo. Ele vai tocar sem som.
        video.play();
        // Se o vídeo estiver tocando, mostramos o botão de som.
        if (!video.paused) {
          unmuteBtn.style.display = 'inline-block';
        }
      });
      
      // Quando o marcador é perdido, pausamos o vídeo e voltamos ao início.
      target0.addEventListener('targetLost', () => {
        video.pause();
        video.currentTime = 0;
      });
      
      // Lógica do botão:
      unmuteBtn.addEventListener('click', () => {
        // Desmuta o vídeo.
        video.muted = false;
        // Esconde o botão.
        unmuteBtn.style.display = 'none';
      });
    </script>
  </body>
</html>
