<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meu WebAR com MindAR</title>

    <!-- A-Frame e MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #000; }
      #unmuteBtn {
        position: fixed; z-index: 10; left: 12px; top: 12px;
        padding: 10px 14px; border: 0; border-radius: 10px;
        background: rgba(0,0,0,.7); color: #fff; font-weight: 600;
        display: none; cursor: pointer;
      }
      #tips {
        position: fixed; z-index: 10; right: 12px; top: 12px;
        color: #fff; background: rgba(0,0,0,.35);
        padding: 8px 12px; border-radius: 10px; font-size: 14px;
      }
      #iosHint {
        position: fixed; inset: 0; display: none;
        place-items: center; background: rgba(0,0,0,.65);
        color: #fff; z-index: 20;
      }
      #iosHint .card {
        background:#111; padding:20px; border-radius:12px;
        max-width: 320px; text-align:center;
      }
    </style>
  </head>
  <body>
    <button id="unmuteBtn">▶️ Ativar Som</button>
    <div id="tips">Aponte para a foto-gatilho</div>
    <div id="iosHint"><div class="card">
      <h3>Permita acesso à câmera</h3>
      <p>Se nada aparecer, toque em “Permitir” para liberar a câmera.</p>
      <button id="closeHint">OK</button>
    </div></div>

    <!-- Cena AR -->
    <a-scene
      mindar-image="imageTargetSrc: targets/targets.mind; autoStart: true;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <video id="video1" src="assets/video.mp4" preload="auto" webkit-playsinline playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Alvo principal -->
      <a-entity id="target0" mindar-image-target="targetIndex: 0">
        <!-- Ajustado para proporção vertical (480x864) -->
        <a-video id="videoPlane" src="#video1" position="0 0 0" rotation="0 0 0" width="1.5" height="2.7"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector('#video1');
      const target0 = document.querySelector('#target0');
      const unmuteBtn = document.querySelector('#unmuteBtn');
      const iosHint = document.querySelector('#iosHint');
      const closeHint = document.querySelector('#closeHint');
      const sceneEl = document.querySelector('a-scene');

      // Inicialmente mutado (autoplay com áudio é bloqueado)
      video.muted = true;

      sceneEl.addEventListener('arReady', () => iosHint.style.display = 'none');
      sceneEl.addEventListener('arError', () => iosHint.style.display = 'grid');
      closeHint?.addEventListener('click', () => iosHint.style.display = 'none');

      // Quando encontrar a imagem, tenta iniciar o vídeo
      target0.addEventListener('targetFound', async () => {
        try {
          await video.play();
          // Se conseguiu tocar, tira o mute automaticamente
          video.muted = false;
        } catch (e) {
          // Se o navegador bloquear, mostra botão
          unmuteBtn.style.display = 'inline-block';
        }
      });

      // Quando perder a imagem, pausa
      target0.addEventListener('targetLost', () => video.pause());

          unmuteBtn.styl
